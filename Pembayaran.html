<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Pojok Teras - katalog menu kantin sekolah yang rapi per kantin." />
  <title>Pojok Teras</title>
  <link rel="stylesheet" href="style.css" />
<style>*,*::before,*::after{animation:none !important;transition:none !important}</style>
</head>
<body>
  <header class="navbar" id="navbar">
    <div class="nav-inner">
      <button class="icon-btn hamburger" id="hamburger" type="button" aria-label="Buka menu akun" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <button class="brand" id="brandBtn" type="button" aria-label="Kembali ke beranda">
        <span class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="118" height="118" fill="none">
            <path d="M12 2 3 7v10l9 5 9-5V7l-9-5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M12 6.5 7 9.3v5.4l5 2.8 5-2.8V9.3L12 6.5Z" fill="currentColor" opacity=".22"/>
            <path d="M12 6.5v11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M7 9.3l5 2.9 5-2.9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="brand-text">
          <strong>Pojok Teras</strong>
          <small>Kantin Sekolah</small>
        </span>
      </button>

      <nav class="nav-links" id="navLinks" aria-label="Daftar kantin"></nav>

      <div class="nav-actions">
        <button class="icon-btn" id="themeToggle" type="button" aria-label="Ubah mode warna">
          <svg class="ico-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
          </svg>
          <svg class="ico-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <div class="overlay" id="overlay" hidden></div>

  <aside class="account-panel" id="accountPanel" aria-hidden="true">
    <div class="account-head">
      <div class="avatar" id="accountAvatar">C</div>
      <div class="account-meta">
        <p class="account-name" id="accountName">Chrystian</p>
        <p class="account-id">ID <span id="accountId">000</span></p>
      </div>
      <button class="panel-close" id="panelClose" type="button" aria-label="Tutup menu">&times;</button>
    </div>

    <div class="account-body">
      <div class="panel-card">
        <button class="panel-toggle" id="feedbackToggle" type="button" aria-expanded="false" aria-controls="feedbackFormWrap">
          <span class="panel-toggle-text">
            <h3>Feedback</h3>
            <p class="muted">Bantu kami memperbaiki Pojok Teras.</p>
          </span>
          <svg class="toggle-chevron" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m6 9 6 6 6-6" />
          </svg>
        </button>
        <div class="feedback-wrap" id="feedbackFormWrap">
          <form id="feedbackForm" novalidate>
            <label for="fbName">Nama</label>
            <input id="fbName" name="nama" type="text" placeholder="Nama kamu" required />

            <label for="fbTopic">Topik</label>
            <input id="fbTopic" name="topik" type="text" placeholder="Contoh: Menu / Tampilan" required />

            <label for="fbMessage">Pesan</label>
            <textarea id="fbMessage" name="pesan" rows="3" placeholder="Tulis masukanmu..." required></textarea>

            <button class="btn btn-primary" type="submit" id="feedbackSubmit">Kirim Feedback</button>
          </form>
        </div>
      </div>
    </div>
  </aside>

  <main class="content">
    <div id="canteenSections"></div>
  </main>

  <footer class="footer">
    <p>&copy; <span id="year"></span> Pojok Teras &middot; dibuat oleh Chrystian</p>
    <a href="#" id="footerFeedback">Kirim Feedback</a>
  </footer>

  <!-- Bottom sheet (keranjang) -->
  <div class="sheet-wrap" id="sheetWrap" hidden>
    <section class="bottom-sheet collapsed" id="bottomSheet" role="dialog" aria-modal="false" aria-label="Keranjang pesanan">
      <button class="sheet-handle" id="sheetToggle" type="button" aria-expanded="false" aria-controls="sheetBody" aria-label="Perkecil atau perbesar keranjang">
        <span class="handle-bar"></span>
        <svg class="handle-chevron" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m6 9 6 6 6-6" />
        </svg>
      </button>
      <div class="sheet-panel">
        <div class="sheet-head">
          <h2>Pesanan Kamu</h2>
          <span class="sheet-count" id="sheetCount">0 item</span>
        </div>
        <div class="sheet-body" id="sheetBody"></div>
      </div>
      <div class="sheet-foot">
        <div class="total-line">
          <span>Total Harga</span>
          <strong id="sheetTotal">Rp 0</strong>
        </div>
        <button class="btn btn-primary btn-block" id="sheetPay" type="button" disabled>Bayar</button>
      </div>
    </section>
  </div>

  <!-- Payment modal -->
  <div class="modal-wrap" id="payWrap" hidden>
    <div class="modal-backdrop" id="payBackdrop"></div>
    <section class="modal" id="payModal" role="dialog" aria-modal="true" aria-label="Konfirmasi pembayaran">
      <div class="modal-head">
        <h2>Konfirmasi Pembayaran</h2>
        <button class="panel-close" id="payClose" type="button" aria-label="Tutup">&times;</button>
      </div>
      <div class="modal-body">
        <div class="pay-list" id="payList"></div>
        <div class="grand-total">
          <span>Total Bayar</span>
          <strong id="payTotal">Rp 0</strong>
        </div>
        <div class="pay-methods">
          <p class="pay-methods-title">Metode Pembayaran</p>
          <div class="method-grid" id="methodGrid">
            <label class="method"><input type="radio" name="payMethod" value="QRIS" /><span>QRIS</span></label>
            <label class="method"><input type="radio" name="payMethod" value="GoPay" /><span>GoPay</span></label>
            <label class="method"><input type="radio" name="payMethod" value="DANA" /><span>DANA</span></label>
            <label class="method"><input type="radio" name="payMethod" value="ShopeePay" /><span>ShopeePay</span></label>
          </div>
          <p class="pay-error" id="payError" hidden>Silakan pilih metode pembayaran terlebih dahulu.</p>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" id="payCancel" type="button">Batal</button>
        <button class="btn btn-primary" id="payConfirm" type="button">Bayar</button>
      </div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
<script>window.addEventListener("load",function(){try{var c=document.querySelectorAll('.card');c[0].click();c[1].click();c[4].click();var b=document.getElementById('bottomSheet');b.classList.add('collapsed');document.getElementById('sheetToggle').setAttribute('aria-expanded','false');}catch(e){document.title="ERR "+e.message}});</script>
</body>
</html>
